<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%236366f1'/><text x='32' y='45' font-size='36' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'>N</text></svg>" />
    <title>AI Customer Service Platform · 星澜数码智能客服</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">N</div>
        <div>
          <p class="brand-name">NovaTech 星澜数码</p>
          <p class="brand-sub">AI Customer Service Platform</p>
        </div>
      </div>

      <div class="side-block">
        <p class="side-title">快捷场景</p>
        <div class="quick" id="prompts"></div>
      </div>

      <div class="side-block">
        <p class="side-title">演示订单号</p>
        <ul class="order-list">
          <li><code>SO20260912001</code> <span>· 耳机 / 运输中</span></li>
          <li><code>SO20260920002</code> <span>· 手表 / 已签收</span></li>
          <li><code>SO20260930004</code> <span>· 耳麦 / 退款审核中</span></li>
        </ul>
      </div>

      <div class="side-block">
        <p class="side-title">运行模式</p>
        <p class="side-meta" id="mode-badge">本地规则路由 + BM25 RAG</p>
      </div>
    </aside>

    <main class="chat-area">
      <header class="chat-header">
        <div>
          <h1>智能客服工作台</h1>
          <p class="sub">售前咨询 · 售后支持 · 智能工单</p>
        </div>
        <div class="header-stats" id="header-stats">
          <a class="showcase-btn" href="/showcase">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            查看项目介绍
          </a>
        </div>
      </header>

      <section class="chat" id="chat" aria-live="polite"></section>
      <p class="error" id="error"></p>

      <form class="composer" id="composer">
        <input id="message-input" placeholder="请输入您的问题，例如：Air100 和 Studio200 怎么选？" />
        <button type="submit">发送</button>
      </form>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
